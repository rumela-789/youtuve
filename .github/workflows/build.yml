name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If the repo root contains project .zip files (e.g. NativeTube_v5_9.zip), unzips the highest version; otherwise use the repo files as they are.
      - name: Unzip project (if a zip is uploaded)
        run: |
          zip=$(ls *.zip 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$zip" ]; then
            echo "Unzipping $zip"
            rm -rf _proj && mkdir _proj && unzip -q -o "$zip" -d _proj
          fi

      # Finds the folder that holds settings.gradle, wherever it is (no fixed folder name needed)
      - name: Find project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' -not -path '*/node_modules/*' | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle not found"; ls -R | head -50; exit 1; fi
          dir=$(dirname "$f")
          echo "Project dir: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
