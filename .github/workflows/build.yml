name: Build APK from ZIP
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q YouTubeWeb_Android_Project_v1.2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: YouTubeWeb_Android_Project
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Web-debug-apk
          path: YouTubeWeb_Android_Project/app/build/outputs/apk/debug/app-debug.apk
