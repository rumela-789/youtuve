plugins {
    id 'com.android.application'
}

android {
    namespace 'com.manik.youtubeweb'
    compileSdk 35

    defaultConfig {
        applicationId 'com.manik.youtubeweb'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Fixed key so every new APK can be installed over the old one (settings stay).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
